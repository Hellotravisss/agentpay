<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentpay · dashboard</title>
<style>
  :root {
    --bg: #0f1419; --panel: #161b22; --border: #232a33; --text: #c9d1d9;
    --dim: #8b949e; --cyan: #39bae6; --green: #7fd962; --red: #f07178; --amber: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; color: var(--cyan); }
  header .sub { color: var(--dim); }
  header .status { margin-left: auto; color: var(--dim); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
  main { padding: 20px 24px; max-width: 1100px; }
  section { margin-bottom: 32px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .card .top { display: flex; align-items: center; justify-content: space-between; }
  .card .name { font-weight: 700; }
  .badge { font-size: 11px; color: var(--dim); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
  .badge.off { color: var(--red); border-color: var(--red); }
  .row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; }
  .row .k { color: var(--dim); }
  .bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--cyan); }
  .bar.over > i { background: var(--red); }
  .rails { margin-top: 10px; font-size: 12px; color: var(--dim); }
  .rails div { display: flex; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.wrap { white-space: normal; word-break: break-all; color: var(--dim); }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; }
  .pill.executed, .pill.approved { color: var(--green); background: rgba(127,217,98,.12); }
  .pill.denied, .pill.failed, .pill.rejected, .pill.missing { color: var(--red); background: rgba(240,113,120,.12); }
  .pill.held { color: var(--amber); background: rgba(255,180,84,.12); }
  button { font: inherit; font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 5px; padding: 4px 12px; cursor: pointer; }
  button.approve { color: var(--green); border-color: var(--green); }
  button.reject { color: var(--red); border-color: var(--red); }
  button:hover { filter: brightness(1.3); }
  .empty { color: var(--dim); font-style: italic; padding: 10px; }
</style>
</head>
<body>
<header>
  <h1>agentpay</h1>
  <span class="sub">spend-policy gateway · admin</span>
  <span class="status"><span class="dot" id="dot"></span><span id="updated">connecting…</span></span>
</header>
<main>
  <section>
    <h2>Agents — spend vs. limits (base currency)</h2>
    <div class="grid" id="agents"></div>
  </section>
  <section>
    <h2>Pending approvals</h2>
    <div id="approvals"></div>
  </section>
  <section>
    <h2>Audit trail</h2>
    <div id="audit"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (s) => { const n = parseFloat(s); return Number.isFinite(n) ? n : 0; };
const timeOf = (ms) => new Date(ms).toISOString().slice(11, 19);

async function getJSON(url, init) {
  const res = await fetch(url, init);
  if (!res.ok && !init) throw new Error(url + " -> " + res.status);
  return res.json();
}

function agentCard(a, spend) {
  const lim = spend.limits || {};
  const bar = (spent, budget) => {
    if (!budget) return "";
    const pct = Math.min(100, (num(spent) / num(budget)) * 100);
    return '<div class="bar ' + (pct >= 100 ? "over" : "") + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>';
  };
  const line = (k, spent, budget) =>
    '<div class="row"><span class="k">' + k + '</span><span>' + esc(spent) + (budget ? " / " + esc(budget) : "") + " " + esc(spend.currency) + "</span></div>" + bar(spent, budget);

  const rails = Object.entries(spend.perRail || {}).map(([rail, info]) => {
    const native = Object.entries(info.amounts).map(([c, amt]) => esc(amt) + " " + esc(c)).join(", ");
    return "<div><span>" + esc(rail) + "</span><span>" + native + " · " + info.transactions + " tx</span></div>";
  }).join("");

  return '<div class="card">'
    + '<div class="top"><span class="name">' + esc(a.agentId) + '</span>'
    + '<span class="badge ' + (a.enabled ? "" : "off") + '">' + (a.enabled ? esc(spend.currency) : "disabled") + "</span></div>"
    + line("today", spend.spentToday, lim.dailyBudget)
    + line("month", spend.spentThisMonth, lim.monthlyBudget)
    + '<div class="row"><span class="k">tx today</span><span>' + spend.transactionsToday + (lim.maxTransactionsPerDay ? " / " + lim.maxTransactionsPerDay : "") + "</span></div>"
    + (lim.perTransactionMax ? '<div class="row"><span class="k">per-tx max</span><span>' + esc(lim.perTransactionMax) + "</span></div>" : "")
    + (a.requireApprovalOver ? '<div class="row"><span class="k">approval over</span><span>' + esc(a.requireApprovalOver) + "</span></div>" : "")
    + (rails ? '<div class="rails">' + rails + "</div>" : "")
    + "</div>";
}

async function loadAgents() {
  const { agents } = await getJSON("/admin/agents");
  const cards = await Promise.all(agents.map(async (a) => agentCard(a, await getJSON("/admin/spend/" + encodeURIComponent(a.agentId)))));
  $("agents").innerHTML = cards.join("") || '<div class="empty">no agents configured</div>';
}

async function loadApprovals() {
  const { approvals } = await getJSON("/admin/approvals?status=pending");
  if (!approvals.length) { $("approvals").innerHTML = '<div class="empty">nothing waiting for review</div>'; return; }
  const rows = approvals.map((a) => {
    const r = a.requirement;
    return "<tr><td>" + esc(a.agentId) + "</td>"
      + "<td>" + esc(a.baseAmount) + " " + esc(a.baseCurrency) + " <span class=k>(" + esc(r.amount) + " " + esc(r.currency) + ")</span></td>"
      + "<td>" + esc(r.payTo) + "</td><td class=wrap>" + esc(r.resource) + "</td>"
      + "<td>" + timeOf(a.createdAt) + "</td>"
      + '<td><button class="approve" onclick="decide(\'' + a.id + "','approve')\">approve</button> "
      + '<button class="reject" onclick="decide(\'' + a.id + "','reject')\">reject</button></td></tr>";
  }).join("");
  $("approvals").innerHTML = "<table><tr><th>agent</th><th>amount</th><th>payee</th><th>resource</th><th>held</th><th></th></tr>" + rows + "</table>";
}

async function loadAudit() {
  const { entries } = await getJSON("/admin/audit?limit=30");
  if (!entries.length) { $("audit").innerHTML = '<div class="empty">no activity yet</div>'; return; }
  const rows = entries.slice().reverse().map((e) => {
    const d = e.details || {};
    const r = d.receipt;
    const what = r ? esc(r.amount + " " + r.currency + " → " + r.payTo + " via " + r.rail)
      : esc(d.rule || d.message || (d.requirement ? d.baseAmount + " " + (d.requirement.currency || "") : ""));
    const kind = e.event.replace("payment_", "").replace("policy_", "");
    return "<tr><td>" + timeOf(e.timestamp) + '</td><td><span class="pill ' + kind + '">' + esc(e.event) + "</span></td>"
      + "<td>" + esc(e.agentId) + "</td><td class=wrap>" + what + "</td></tr>";
  }).join("");
  $("audit").innerHTML = "<table><tr><th>time (UTC)</th><th>event</th><th>agent</th><th>detail</th></tr>" + rows + "</table>";
}

async function decide(id, decision) {
  await fetch("/admin/approvals/" + id, { method: "POST", body: JSON.stringify({ decision }) });
  refresh();
}

async function refresh() {
  try {
    await Promise.all([loadAgents(), loadApprovals(), loadAudit()]);
    $("dot").style.background = "var(--green)";
    $("updated").textContent = "updated " + timeOf(Date.now()) + " UTC";
  } catch (err) {
    $("dot").style.background = "var(--red)";
    $("updated").textContent = "error: " + err.message;
  }
}

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
