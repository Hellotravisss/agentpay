<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentpay · dashboard</title>
<style>
  :root {
    --bg: #0a0e14; --bg2: #0f141c; --panel: #141b24; --panel2: #1a222d;
    --border: #232c38; --border2: #2d3845; --text: #e3e8ef; --dim: #8a97a8; --faint: #5c6776;
    --cyan: #4dd0e1; --teal: #2dd4bf; --green: #7fd962; --red: #f0717a; --amber: #ffb454; --violet: #a78bfa;
    --shadow: 0 8px 30px rgba(0,0,0,.35);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #11202b 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }
  /* ── header ── */
  header {
    display: flex; align-items: center; gap: 14px; padding: 16px 28px;
    border-bottom: 1px solid var(--border); background: rgba(10,14,20,.7); backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 5;
  }
  .logo { width: 30px; height: 30px; flex: none; }
  header h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  header h1 b { color: var(--cyan); font-weight: 650; }
  header .tag { color: var(--faint); font-size: 12px; }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .status { color: var(--dim); font-size: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 7px; box-shadow: 0 0 8px var(--green); }
  .dot.bad { background: var(--red); box-shadow: 0 0 8px var(--red); }
  /* ── stats strip ── */
  .stats { display: flex; gap: 28px; padding: 16px 28px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stat .v { font-family: var(--mono); font-size: 22px; font-weight: 600; }
  .stat .l { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  /* ── layout ── */
  main { padding: 24px 28px; max-width: 1180px; }
  section { margin-bottom: 36px; }
  .h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .h h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 0; font-weight: 600; }
  .h .line { flex: 1; height: 1px; background: var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  /* ── cards ── */
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg2) 100%);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--border2); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .name { font-weight: 650; font-size: 15px; }
  .card .top .grow { flex: 1; }
  .chip { font-size: 11px; color: var(--dim); border: 1px solid var(--border2); border-radius: 999px; padding: 2px 9px; font-family: var(--mono); }
  .chip.usd { color: var(--teal); border-color: rgba(45,212,191,.4); }
  .chip.off { color: var(--red); border-color: rgba(240,113,122,.4); }
  .iconbtn { background: none; border: none; color: var(--faint); cursor: pointer; padding: 4px; border-radius: 6px; line-height: 0; }
  .iconbtn:hover { color: var(--cyan); background: var(--panel2); }
  .meter { margin-top: 14px; }
  .meter .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .meter .row .k { color: var(--dim); }
  .meter .row .val { font-family: var(--mono); }
  .bar { height: 7px; background: #0c1218; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--teal), var(--cyan)); transition: width .4s ease; }
  .bar.warn > i { background: linear-gradient(90deg, var(--amber), #ff8a4c); }
  .bar.over > i { background: linear-gradient(90deg, #f0717a, #ff5470); }
  .kvs { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .kv { display: flex; justify-content: space-between; font-size: 12px; }
  .kv .k { color: var(--faint); }
  .kv .v { font-family: var(--mono); color: var(--dim); }
  .rails { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 12px; }
  .rails .r { display: flex; justify-content: space-between; color: var(--dim); }
  .rails .r .mono { color: var(--text); }
  .addcard {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 120px;
    border: 1px dashed var(--border2); border-radius: 12px; color: var(--dim); cursor: pointer; background: none;
    font-family: var(--sans); font-size: 14px; transition: all .12s ease;
  }
  .addcard:hover { color: var(--cyan); border-color: var(--cyan); background: rgba(77,208,225,.04); }
  /* ── tables ── */
  .tablewrap { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel2); }
  th { color: var(--faint); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  td.mono { font-family: var(--mono); }
  td.wrap { white-space: normal; word-break: break-all; color: var(--dim); max-width: 340px; }
  .pill { font-family: var(--mono); font-size: 11px; padding: 2px 9px; border-radius: 999px; }
  .pill.executed, .pill.approved { color: var(--green); background: rgba(127,217,98,.12); }
  .pill.denied, .pill.failed, .pill.rejected, .pill.missing { color: var(--red); background: rgba(240,113,122,.12); }
  .pill.held { color: var(--amber); background: rgba(255,180,84,.12); }
  .pill.changed { color: var(--violet); background: rgba(167,139,250,.14); }
  /* ── buttons ── */
  button.btn { font-family: var(--sans); font-size: 13px; border: 1px solid var(--border2); background: var(--panel2); color: var(--text); border-radius: 8px; padding: 6px 14px; cursor: pointer; transition: all .12s ease; }
  button.btn:hover { border-color: var(--faint); }
  button.btn.approve { color: #0a0e14; background: var(--green); border-color: var(--green); font-weight: 600; }
  button.btn.reject { color: var(--red); background: transparent; border-color: rgba(240,113,122,.5); }
  button.btn.reject:hover { background: rgba(240,113,122,.1); }
  button.btn.primary { color: #0a0e14; background: linear-gradient(90deg, var(--teal), var(--cyan)); border: none; font-weight: 600; }
  button.btn.danger { color: var(--red); border-color: rgba(240,113,122,.5); background: transparent; }
  button.btn.danger:hover { background: rgba(240,113,122,.1); }
  .empty { color: var(--faint); font-style: italic; padding: 18px; text-align: center; }
  /* ── modal ── */
  .overlay { position: fixed; inset: 0; background: rgba(4,7,11,.6); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 20; }
  .overlay.show { display: flex; }
  .modal { width: min(560px, 92vw); max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--border2); border-radius: 14px; box-shadow: var(--shadow); }
  .modal .mhead { display: flex; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal .mhead h3 { margin: 0; font-size: 16px; }
  .modal .mhead .x { margin-left: auto; }
  .modal .body { padding: 20px 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .field .hint { color: var(--faint); font-weight: 400; }
  .field input[type=text] { width: 100%; background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; padding: 9px 11px; color: var(--text); font-family: var(--mono); font-size: 13px; }
  .field input[type=text]:focus { outline: none; border-color: var(--cyan); }
  .field input:disabled { color: var(--faint); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .switch { display: flex; align-items: center; gap: 10px; }
  .switch input { width: 16px; height: 16px; accent-color: var(--teal); }
  .mfoot { display: flex; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); }
  .mfoot .grow { flex: 1; }
  .err { color: var(--red); font-size: 12px; padding: 0 22px 12px; min-height: 0; }
  /* ── toast ── */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .25s ease; background: var(--panel2); border: 1px solid var(--border2); border-radius: 10px; padding: 11px 18px; font-size: 13px; box-shadow: var(--shadow); z-index: 30; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: rgba(127,217,98,.5); }
  #toast.bad { border-color: rgba(240,113,122,.5); }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="1.5" y="1.5" width="29" height="29" rx="8" stroke="url(#g)" stroke-width="1.5"/>
    <path d="M10 21l4.5-11h3L22 21h-3l-1-2.6h-4L13 21h-3z" fill="url(#g)"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#4dd0e1"/></linearGradient></defs>
  </svg>
  <h1><b>agentpay</b></h1>
  <span class="tag">spend-policy gateway · admin</span>
  <div class="right">
    <span class="status"><span class="dot" id="dot"></span><span id="updated">connecting…</span></span>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="v" id="s-agents">–</div><div class="l">agents</div></div>
  <div class="stat"><div class="v" id="s-pending">–</div><div class="l">pending approvals</div></div>
  <div class="stat"><div class="v" id="s-exec">–</div><div class="l">payments today</div></div>
  <div class="stat"><div class="v" id="s-denied">–</div><div class="l">denied / held today</div></div>
</div>

<main>
  <section>
    <div class="h"><h2>Agents — spend vs. limits (base currency)</h2><span class="line"></span></div>
    <div class="grid" id="agents"></div>
  </section>
  <section>
    <div class="h"><h2>Pending approvals</h2><span class="line"></span></div>
    <div id="approvals"></div>
  </section>
  <section>
    <div class="h"><h2>Audit trail</h2><span class="line"></span></div>
    <div id="audit"></div>
  </section>
</main>

<!-- edit / add agent modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhead"><h3 id="m-title">Edit agent</h3><button class="iconbtn x" onclick="closeModal()" aria-label="close">✕</button></div>
    <div class="body">
      <div class="field"><label>agent id</label><input type="text" id="f-agentId" placeholder="research-bot" /></div>
      <div class="grid2">
        <div class="field"><label>base currency</label><input type="text" id="f-currency" placeholder="USD" /></div>
        <div class="field"><label>&nbsp;</label><div class="switch"><input type="checkbox" id="f-enabled" /><label for="f-enabled" style="margin:0">enabled</label></div></div>
      </div>
      <div class="grid2">
        <div class="field"><label>per-transaction max</label><input type="text" id="f-perTransactionMax" placeholder="1.00" /></div>
        <div class="field"><label>max tx / day</label><input type="text" id="f-maxTransactionsPerDay" placeholder="200" /></div>
        <div class="field"><label>daily budget</label><input type="text" id="f-dailyBudget" placeholder="10.00" /></div>
        <div class="field"><label>monthly budget</label><input type="text" id="f-monthlyBudget" placeholder="100.00" /></div>
      </div>
      <div class="field"><label>require approval over <span class="hint">(base ccy, blank = never)</span></label><input type="text" id="f-requireApprovalOver" placeholder="0.50" /></div>
      <div class="field"><label>rail preference <span class="hint">(comma-separated)</span></label><input type="text" id="f-railPreference" placeholder="x402, alipay-act" /></div>
      <div class="grid2">
        <div class="field"><label>payee allowlist <span class="hint">(comma)</span></label><input type="text" id="f-payeeAllowlist" placeholder="merchant-a" /></div>
        <div class="field"><label>payee blocklist <span class="hint">(comma)</span></label><input type="text" id="f-payeeBlocklist" placeholder="merchant-shady" /></div>
      </div>
    </div>
    <div class="err" id="m-err"></div>
    <div class="mfoot">
      <button class="btn danger" id="m-delete" onclick="deleteAgent()">Delete</button>
      <span class="grow"></span>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveAgent()">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (s) => { const n = parseFloat(s); return Number.isFinite(n) ? n : 0; };
const timeOf = (ms) => new Date(ms).toISOString().slice(11, 19);
const startOfUtcDay = (ms) => { const d = new Date(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };

async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + " → " + r.status); return r.json(); }

function toast(msg, kind) {
  const t = $("toast"); t.textContent = msg; t.className = "show " + (kind || "");
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = ""), 2600);
}

function meter(k, spent, budget, ccy) {
  const has = budget != null && budget !== "";
  const pct = has ? Math.min(100, (num(spent) / num(budget)) * 100) : 0;
  const cls = pct >= 100 ? "over" : pct >= 80 ? "warn" : "";
  return '<div class="meter"><div class="row"><span class="k">' + k + '</span>'
    + '<span class="val">' + esc(spent) + (has ? " / " + esc(budget) : "") + " " + esc(ccy) + "</span></div>"
    + (has ? '<div class="bar ' + cls + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' : "") + "</div>";
}

function agentCard(a, spend) {
  const L = spend.limits || {};
  const kv = (k, v) => v == null ? "" : '<div class="kv"><span class="k">' + k + '</span><span class="v">' + esc(v) + "</span></div>";
  const rails = Object.entries(spend.perRail || {}).map(([rail, info]) => {
    const native = Object.entries(info.amounts).map(([c, amt]) => esc(amt) + " " + esc(c)).join(", ");
    return '<div class="r"><span>' + esc(rail) + '</span><span class="mono">' + native + " · " + info.transactions + " tx</span></div>";
  }).join("");
  return '<div class="card">'
    + '<div class="top"><span class="name">' + esc(a.agentId) + '</span><span class="grow"></span>'
    + '<span class="chip ' + (a.enabled ? "usd" : "off") + '">' + (a.enabled ? esc(spend.currency) : "disabled") + "</span>"
    + '<button class="iconbtn" title="edit" onclick=\'editAgent(' + JSON.stringify(JSON.stringify(a)) + ')\'>'
    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button></div>'
    + meter("today", spend.spentToday, L.dailyBudget, spend.currency)
    + meter("month", spend.spentThisMonth, L.monthlyBudget, spend.currency)
    + '<div class="kvs">'
    + kv("tx today", spend.transactionsToday + (L.maxTransactionsPerDay ? " / " + L.maxTransactionsPerDay : ""))
    + kv("per-tx max", L.perTransactionMax) + kv("approval over", L.requireApprovalOver)
    + kv("rails", (a.railPreference || []).join(" › ") || null) + "</div>"
    + (rails ? '<div class="rails">' + rails + "</div>" : "") + "</div>";
}

let cache = { agents: [], approvals: [], audit: [] };

async function loadAgents() {
  const { agents } = await getJSON("/admin/agents");
  cache.agents = agents;
  const spends = await Promise.all(agents.map((a) => getJSON("/admin/spend/" + encodeURIComponent(a.agentId))));
  const cards = agents.map((a, i) => agentCard(a, spends[i])).join("");
  $("agents").innerHTML = cards + '<button class="addcard" onclick="addAgent()">＋ add agent</button>';
  $("s-agents").textContent = agents.length;
}

async function loadApprovals() {
  const { approvals } = await getJSON("/admin/approvals?status=pending");
  cache.approvals = approvals;
  $("s-pending").textContent = approvals.length;
  if (!approvals.length) { $("approvals").innerHTML = '<div class="tablewrap"><div class="empty">nothing waiting for review</div></div>'; return; }
  const rows = approvals.map((a) => {
    const r = a.requirement;
    return "<tr><td>" + esc(a.agentId) + '</td><td class="mono">' + esc(a.baseAmount) + " " + esc(a.baseCurrency)
      + ' <span style="color:var(--faint)">(' + esc(r.amount) + " " + esc(r.currency) + ")</span></td>"
      + "<td>" + esc(r.payTo) + '</td><td class="wrap">' + esc(r.resource) + "</td>"
      + '<td class="mono">' + timeOf(a.createdAt) + "</td>"
      + '<td><button class="btn approve" onclick="decide(\'' + a.id + "','approve')\">approve</button> "
      + '<button class="btn reject" onclick="decide(\'' + a.id + "','reject')\">reject</button></td></tr>";
  }).join("");
  $("approvals").innerHTML = '<div class="tablewrap"><table><thead><tr><th>agent</th><th>amount</th><th>payee</th><th>resource</th><th>held</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>";
}

async function loadAudit() {
  const { entries } = await getJSON("/admin/audit?limit=40");
  cache.audit = entries;
  const today = startOfUtcDay(Date.now());
  const todays = entries.filter((e) => e.timestamp >= today);
  $("s-exec").textContent = todays.filter((e) => e.event === "payment_executed").length;
  $("s-denied").textContent = todays.filter((e) => e.event === "payment_denied" || e.event === "payment_held").length;
  if (!entries.length) { $("audit").innerHTML = '<div class="tablewrap"><div class="empty">no activity yet</div></div>'; return; }
  const rows = entries.slice().reverse().map((e) => {
    const d = e.details || {}, r = d.receipt;
    const what = r ? esc(r.amount + " " + r.currency + " → " + r.payTo + " via " + r.rail)
      : esc(d.rule || d.action || d.message || (d.requirement ? d.baseAmount + " " + (d.requirement.currency || "") : ""));
    const kind = e.event.replace("payment_", "").replace("policy_", "");
    return '<tr><td class="mono">' + timeOf(e.timestamp) + '</td><td><span class="pill ' + kind + '">' + esc(e.event) + "</span></td>"
      + "<td>" + esc(e.agentId) + '</td><td class="wrap">' + what + "</td></tr>";
  }).join("");
  $("audit").innerHTML = '<div class="tablewrap"><table><thead><tr><th>time (UTC)</th><th>event</th><th>agent</th><th>detail</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
}

async function decide(id, decision) {
  try { await fetch("/admin/approvals/" + id, { method: "POST", body: JSON.stringify({ decision }) }); toast("approval " + decision + "d", "ok"); }
  catch (e) { toast("failed: " + e.message, "bad"); }
  refresh();
}

/* ── edit / add agent ── */
let editing = null; // agentId being edited, or null when adding
const FIELDS = ["agentId","currency","perTransactionMax","maxTransactionsPerDay","dailyBudget","monthlyBudget","requireApprovalOver","railPreference","payeeAllowlist","payeeBlocklist"];

function openModal(a, isNew) {
  editing = isNew ? null : a.agentId;
  $("m-title").textContent = isNew ? "Add agent" : "Edit " + a.agentId;
  $("m-err").textContent = "";
  $("f-agentId").value = a.agentId || "";
  $("f-agentId").disabled = !isNew;
  $("f-currency").value = a.currency || "USD";
  $("f-enabled").checked = a.enabled !== false;
  for (const f of ["perTransactionMax","maxTransactionsPerDay","dailyBudget","monthlyBudget","requireApprovalOver"]) $("f-" + f).value = a[f] ?? "";
  for (const f of ["railPreference","payeeAllowlist","payeeBlocklist"]) $("f-" + f).value = (a[f] || []).join(", ");
  $("m-delete").style.display = isNew ? "none" : "";
  $("overlay").classList.add("show");
}
function closeModal() { $("overlay").classList.remove("show"); }
function editAgent(json) { openModal(JSON.parse(json), false); }
function addAgent() { openModal({}, true); }

function buildPolicy() {
  const list = (id) => $("f-" + id).value.split(",").map((s) => s.trim()).filter(Boolean);
  const str = (id) => { const v = $("f-" + id).value.trim(); return v === "" ? undefined : v; };
  const p = { agentId: $("f-agentId").value.trim(), enabled: $("f-enabled").checked, currency: $("f-currency").value.trim() };
  for (const f of ["perTransactionMax","dailyBudget","monthlyBudget","requireApprovalOver"]) { const v = str(f); if (v !== undefined) p[f] = v; }
  const mtx = str("maxTransactionsPerDay"); if (mtx !== undefined) p.maxTransactionsPerDay = Number(mtx);
  for (const f of ["railPreference","payeeAllowlist","payeeBlocklist"]) { const l = list(f); if (l.length) p[f] = l; }
  return p;
}

async function saveAgent() {
  const p = buildPolicy();
  if (!p.agentId) { $("m-err").textContent = "agent id is required"; return; }
  const res = await fetch("/admin/agents/" + encodeURIComponent(p.agentId), { method: "PUT", body: JSON.stringify(p) });
  if (!res.ok) { const b = await res.json().catch(() => ({})); $("m-err").textContent = b.message || ("error " + res.status); return; }
  closeModal(); toast("saved " + p.agentId, "ok"); refresh();
}

async function deleteAgent() {
  if (!editing || !confirm("Remove agent \"" + editing + "\"? It reverts to deny-by-default.")) return;
  const res = await fetch("/admin/agents/" + encodeURIComponent(editing), { method: "DELETE" });
  closeModal(); toast(res.ok ? "removed " + editing : "delete failed", res.ok ? "ok" : "bad"); refresh();
}

$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

async function refresh() {
  try {
    await Promise.all([loadAgents(), loadApprovals(), loadAudit()]);
    $("dot").className = "dot"; $("updated").textContent = "updated " + timeOf(Date.now()) + " UTC";
  } catch (err) {
    $("dot").className = "dot bad"; $("updated").textContent = "error: " + err.message;
  }
}
refresh();
setInterval(() => { if (!$("overlay").classList.contains("show")) refresh(); }, 4000);
</script>
</body>
</html>
